panel: [lda, nmf, gsdmm, bertopic]
selection_rule: one_profile_per_model_selected_by_equal_fold_seed_mean_npmi_then_cv_then_profile_index
maximum_profiles_per_model: 2
profiles:
  lda:
    - {name: library_default_k10, alpha: symmetric, eta: null, passes: 1, iterations: 50}
  nmf:
    - {name: sklearn_default_tfidf_k10, input: tfidf, init: nndsvda, solver: cd, beta_loss: frobenius, max_iter: 200, tol: 0.0001}
  gsdmm:
    - {name: reference_default_k10, alpha: 0.1, beta: 0.1, iterations: 30, input: unique_word_sets}
  bertopic:
    - {name: library_default_hdbscan_common_k10, neighbors: 15, components: 5, min_dist: 0.0, metric: cosine, cluster: hdbscan, min_cluster_size: 10, ctfidf_bm25: false, reduce_frequent_words: false}
    - {name: k10_default_neighbors15, neighbors: 15, components: 5, min_dist: 0.0, metric: cosine, cluster: kmeans, n_init: 10, ctfidf_bm25: false, reduce_frequent_words: false}
